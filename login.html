<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | AI Fitness Coach</title><link rel="stylesheet" href="style.css"></head><body>
<div class="auth-shell"><section class="auth-hero"><div class="logo"><i>✦</i> AI Fitness Coach</div><h1>Welcome <span>back.</span></h1><p>Log in to access your dashboard, daily routine, habit tracker and AI wellness assistant.</p><div class="bullets"><div><b>✓</b> Your profile is saved securely</div><div><b>✓</b> Daily routine & habits</div><div><b>✓</b> AI wellness assistant</div></div></section>
<section class="auth-box"><div class="form"><h2>Login</h2><p class="sub">Use the email and password you registered with.</p><div id="msg" class="msg"></div><form id="loginForm">
<div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div>
<div class="field"><label>Password</label><input id="password" type="password" required placeholder="Your password"></div>
<button id="btn" class="primary fullbtn">Login</button></form><p class="switch">Don't have an account? <a href="signup.html">Create one</a></p></div></section></div><script type="module" src="auth.js"></script></body></html>
